  select.value=selected;select.setAttribute('aria-label',ambientSelect.getAttribute('aria-label'));
 });
}

 soundButton.querySelector('span').textContent=copy[language][soundOn?'soundOn':'soundOff'];
 const journeyButton=document.getElementById('journeySound');
 if(journeyButton){journeyButton.setAttribute('aria-pressed',String(soundOn));journeyButton.textContent=copy[language][soundOn?'soundOn':'soundOff'];}
 document.dispatchEvent(new Event('ambientsoundchange'));
}
async function setAmbientSound(enabled){
 const request=++ambientRequest;ambientWanted=enabled;
 if(!enabled){ambientPlayer.pause();soundOn=false;syncSoundControls();return;}
 try{
  await ambientPlayer.play();
  if(request!==ambientRequest)return;
  soundOn=true;document.getElementById('soundHint').hidden=true;syncSoundControls();
 }catch(error){
  if(request!==ambientRequest)return;
  ambientWanted=false;soundOn=false;ambientPlayer.pause();syncSoundControls();toast(copy[language].audioError);
 }
}
function selectAmbientTrack(file){
 if(!ambientTracks.some(track=>track.file===file))return;
 const resume=ambientWanted;
 // Invalidate a pending play before replacing its source.
 ambientRequest++;ambientPlayer.pause();
 ambientSelect.value=file;
 document.querySelectorAll('.journey-track').forEach(select=>select.value=file);
 ambientPlayer.src='assets/audio/'+file;
 if(resume)setAmbientSound(true);
}
ambientSelect.addEventListener('change',()=>selectAmbientTrack(ambientSelect.value));
ambientPlayer.addEventListener('error',()=>{
 if(!ambientWanted)return;
 setAmbientSound(false);toast(copy[language].audioError);
});
const soundButton=document.getElementById('sound');
function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=copy[language][el.dataset.i18n]});soundButton.querySelector('span').textContent=copy[language][soundOn?'soundOn':'soundOff'];document.getElementById('language').textContent=language==='ko'?'EN':'한국어';document.getElementById('language').setAttribute('aria-label',language==='ko'?'Switch to English':'한국어로 전환');document.getElementById('sceneTitle').textContent=copy[language].scene;document.getElementById('sanctuary').setAttribute('aria-label',language==='ko'?'비 오는 툇마루':'The rainy veranda');document.querySelector('nav').setAttribute('aria-label',copy[language].nav);document.querySelector('meta[name="description"]').content=copy[language].shareText;document.getElementById('viewToggle').textContent=copy[language][immersive?'restore':'view'];document.getElementById('toast').hidden=true;translateTracks();}
document.getElementById('language').addEventListener('click',()=>{language=language==='ko'?'en':'ko';const url=new URL(location.href);url.searchParams.set('lang',language);history.replaceState(null,'',url);translate()});
function toast(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,6000)}
// Web Audio is reserved for the optional ritual's bells and drone.
// Ambient recordings stream through HTMLAudioElement and repeat indefinitely.
function prepareAudio(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('Web Audio unavailable');audio=new Audio();}
soundButton.addEventListener('click',()=>setAmbientSound(!ambientWanted));
// Keep the user's selected rain sound playing in background tabs.
function setImmersive(next){immersive=next;document.body.classList.toggle('immersive',immersive);const button=document.getElementById('viewToggle');button.textContent=copy[language][immersive?'restore':'view'];button.setAttribute('aria-pressed',String(immersive));}
document.getElementById('viewToggle').addEventListener('click',()=>setImmersive(!immersive));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&immersive){setImmersive(false);document.getElementById('viewToggle').focus()}});
document.getElementById('share').addEventListener('click',async()=>{if(['localhost','127.0.0.1',''].includes(location.hostname)||location.protocol==='file:'){toast(copy[language].local);return}const data={title:'Non-Doing · 無爲',text:copy[language].shareText,url:location.href};try{if(navigator.share){await navigator.share(data)}else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(data.url);toast(copy[language].shared)}else{toast(copy[language].manual)}}catch(error){if(error.name!=='AbortError')toast(copy[language].manual)}});
// Cap pixel density and elapsed time; suspend rendering while the tab is hidden.
const canvas=document.getElementById('rain'),ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let width=0,height=0,drops=[],frame=null,last=0;
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drops=Array.from({length:Math.min(150,Math.round(width/9))},()=>({x:Math.random()*width,y:Math.random()*height,speed:160+Math.random()*200,length:8+Math.random()*12,alpha:.12+Math.random()*.18}));if(reduced.matches)draw(0)}
function draw(dt){ctx.clearRect(0,0,width,height);ctx.lineWidth=.7;for(const d of drops){d.y+=d.speed*dt;d.x-=d.speed*.14*dt;if(d.y>height*.78){d.y=height*.13;d.x=Math.random()*width}if(d.x<0)d.x=width;ctx.strokeStyle=`rgba(238,245,227,${d.alpha})`;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2,d.y+d.length);ctx.stroke()}}
function animate(time){draw(last?Math.min((time-last)/1000,.05):0);last=time;frame=requestAnimationFrame(animate)}
function setMotion(){if(frame!==null){cancelAnimationFrame(frame);frame=null}last=0;if(!document.hidden&&!reduced.matches)frame=requestAnimationFrame(animate);else if(reduced.matches)draw(0)}
window.addEventListener('resize',resize);reduced.addEventListener('change',setMotion);document.addEventListener('visibilitychange',setMotion);resize();setMotion();translate();
</script>
